[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kvlab"
version = "0.1.0"
description = "A teaching harness for KV-cache optimization methods (eviction, compression, hybrid memory, alternative attention)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
bench = ["torch>=2.1,<3", "transformers>=4.44,<6", "datasets>=2.19,<5", "tabulate>=0.9"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]
